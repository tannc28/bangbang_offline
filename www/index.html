<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bang Bang Private</title>
  <style>
    :root{color-scheme:dark;font-family:"Segoe UI",Arial,sans-serif}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;min-width:320px;min-height:480px;margin:0;overflow:hidden}
    body{background:#d7ae65 url('assets/f_000022.jpg') center top / cover no-repeat;color:#f8fbff}
    button,input{font:inherit}
    .entry-shell{position:relative;width:100%;height:100%;min-height:480px}
    .card{position:absolute;left:50%;bottom:clamp(10px,3vh,32px);width:min(356px,calc(100% - 32px));padding:19px 22px 17px;transform:translateX(-50%);border:1px solid rgba(255,222,142,.72);border-radius:20px;background:linear-gradient(145deg,rgba(7,34,42,.9),rgba(15,48,53,.8));box-shadow:0 22px 55px rgba(25,19,5,.38),inset 0 1px rgba(255,255,255,.14);backdrop-filter:blur(12px)}
    .screen[hidden]{display:none!important}
    .eyebrow{margin:0 0 4px;color:#ffd77a;font-size:11px;font-weight:800;letter-spacing:.2em;text-align:center}
    h1{margin:0;color:#fff;font-size:25px;line-height:1.15;text-align:center;text-shadow:0 2px 16px rgba(0,0,0,.45)}
    .hint{margin:6px 0 12px;color:#d8e9e7;font-size:12px;line-height:1.35;text-align:center}
    label{display:block;margin:8px 0 5px;color:#f7e9c5;font-size:12px;font-weight:700}
    input[type="text"],input[type="password"]{width:100%;height:40px;padding:0 12px;border:1px solid rgba(255,219,139,.42);border-radius:10px;outline:0;background:rgba(2,22,29,.72);color:#fff;font-size:14px}
    .password-row{position:relative}
    .password-row input{padding-right:62px}
    .toggle-password{position:absolute;top:5px;right:5px;width:52px;height:30px;border:0;border-radius:8px;background:rgba(255,255,255,.1);color:#ffe4a5;font-size:11px;font-weight:800;cursor:pointer}
    .form-meta{display:flex;align-items:center;justify-content:space-between;margin:9px 1px 0;color:#c9dcda;font-size:11px}
    .remember{display:flex;align-items:center;gap:6px;margin:0;cursor:pointer}
    .primary,.danger{width:100%;border-radius:11px;font-weight:900;cursor:pointer}
    .primary{height:42px;margin-top:11px;border:1px solid #ffe09a;background:linear-gradient(180deg,#ffc752,#df8720);color:#17353b;font-size:14px}
    .danger{height:36px;margin-top:8px;border:1px solid rgba(255,219,139,.75);background:linear-gradient(180deg,#b9443b,#812824);color:#fff9e9;font-size:12px}
    button:disabled{cursor:wait;opacity:.65}
    .message{min-height:16px;margin:7px 0 0;color:#ffd0c9;font-size:11px;text-align:center}
    .message.success{color:#c8ffd7}
    .welcome-card{padding-top:24px;padding-bottom:22px;text-align:center}
    #gameShell{position:relative;display:none;width:100%;height:100%;background:#000}
    #game{width:100%;height:calc(100% - 28px);background:#000}
    .game-toolbar{height:28px;padding:4px 12px;background:#15292e;font-size:12px;text-align:right}
    .game-toolbar a,.bot-settings-link{color:#ffe09a}
  </style>
</head>
<body>
  <main id="entry" class="entry-shell">
    <form class="card screen" id="loginForm" novalidate>
      <p class="eyebrow">BANG BANG PRIVATE</p>
      <h1>Chào mừng trở lại</h1>
      <p class="hint">37abc mở http://127.0.0.1:18083/ — server riêng trên máy này, không trỏ netzone.</p>
      <label for="username">Tài khoản</label>
      <input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="32" required autofocus>
      <label for="password">Mật khẩu</label>
      <div class="password-row">
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>
        <button id="togglePassword" class="toggle-password" type="button">Hiện</button>
      </div>
      <div class="form-meta"><label class="remember" for="rememberMe"><input id="rememberMe" type="checkbox"> Ghi nhớ tài khoản</label><span>Kết nối máy chủ local</span></div>
      <button id="submitButton" class="primary" type="submit">Đăng nhập</button>
      <p id="loginError" class="message" role="alert"></p>
    </form>
    <section class="card screen welcome-card" id="welcomeScreen" hidden>
      <p class="eyebrow">ĐĂNG NHẬP THÀNH CÔNG</p>
      <h1>Chào mừng BBer</h1>
      <p id="welcomeAccount" class="hint"></p>
      <button id="enterGameButton" class="primary" type="button">Vào game</button>
      <p><a class="bot-settings-link" href="/bots.html" target="_blank" rel="noopener">Thiết lập trận bot</a> · <a class="bot-settings-link" href="/tank-guide/" target="_blank" rel="noopener">Cẩm nang tank</a></p>
      <button id="logoutButton" class="danger" type="button">Đăng xuất</button>
      <p id="welcomeError" class="message"></p>
    </section>
  </main>
  <section id="gameShell"><nav class="game-toolbar"><a href="/tank-guide/" target="_blank" rel="noopener">Cẩm nang tank ↗</a> · <a href="/bots.html" target="_blank" rel="noopener">Thiết lập trận bot ↗</a></nav><div id="game"></div></section>
  <script>
    (function () {
      var loginForm = document.getElementById('loginForm');
      var welcomeScreen = document.getElementById('welcomeScreen');
      var usernameInput = document.getElementById('username');
      var passwordInput = document.getElementById('password');
      var rememberMe = document.getElementById('rememberMe');
      var submitButton = document.getElementById('submitButton');
      var loginError = document.getElementById('loginError');
      var welcomeAccount = document.getElementById('welcomeAccount');
      var welcomeError = document.getElementById('welcomeError');
      var gameShell = document.getElementById('gameShell');
      var entry = document.getElementById('entry');
      var pending = null;
      // Allow loading directly from 127.0.0.1, localhost, or private host

      function trim(v) { return String(v || '').replace(/^\s+|\s+$/g, ''); }
      function enc(v) { return encodeURIComponent(String(v)); }
      function origin() { return location.protocol + '//' + location.host + '/'; }
      function message(node, value, ok) { node.textContent = value || ''; node.className = 'message' + (ok ? ' success' : ''); }
      function show(screen) { loginForm.hidden = screen !== loginForm; welcomeScreen.hidden = screen !== welcomeScreen; }
      function post(url, payload) {
        return fetch(url, {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload||{})})
          .then(function (r) { if (!r.ok) throw new Error('Máy chủ đang bận.'); return r.json(); });
      }
      function accept(result) {
        if (!result || !result.success || !result.loginToken) throw new Error('Phiên đăng nhập không hợp lệ.');
        var user = result.username || trim(usernameInput.value);
        if (rememberMe.checked) localStorage.setItem('bangbang.username', user);
        pending = {username:user, loginToken:String(result.loginToken)};
        passwordInput.value = '';
        welcomeAccount.textContent = user;
        message(welcomeError, '', false);
        show(welcomeScreen);
      }
      function mountGame() {
        if (!pending) { show(loginForm); return; }
        var vars = 'userId=' + enc(pending.username)
          + '&accessToken=' + enc(pending.loginToken)
          + '&sid=299001&cm=1&ch=website&bblaunch=1'
          + '&rezbase=' + enc(origin())
          + '&version=CRYSTALS-20261014'
          + '&resConfigMd5=resConfigShop20261013.cub'
          + '&offlineBuild=PVP-SHOP-FRAGMENTS-R197-20260909'
          + '&cacheBust=' + Date.now();
        var movie = 'TankLoaderR150.swf?cacheBust=' + Date.now();
        document.getElementById('game').innerHTML =
          '<object id="bangbang" type="application/x-shockwave-flash" data="' + movie + '" width="100%" height="100%">'
          + '<param name="movie" value="' + movie + '">'
          + '<param name="FlashVars" value="' + vars + '">'
          + '<param name="allowScriptAccess" value="sameDomain">'
          + '<param name="allowFullScreen" value="true">'
          + '<param name="wmode" value="direct">'
          + '<embed src="' + movie + '" FlashVars="' + vars + '" width="100%" height="100%" type="application/x-shockwave-flash" allowFullScreen="true" wmode="direct">'
          + '</object>';
        pending = null;
        entry.style.display = 'none';
        gameShell.style.display = 'block';
      }

      usernameInput.value = localStorage.getItem('bangbang.username') || '';
      rememberMe.checked = Boolean(usernameInput.value);
      document.getElementById('togglePassword').onclick = function () {
        var showPw = passwordInput.type === 'password';
        passwordInput.type = showPw ? 'text' : 'password';
        this.textContent = showPw ? 'Ẩn' : 'Hiện';
      };
      loginForm.onsubmit = function (ev) {
        ev.preventDefault();
        var user = trim(usernameInput.value), pw = passwordInput.value;
        message(loginError, '', false);
        if (user.length < 3 || user.length > 32) { message(loginError, 'Tài khoản 3–32 ký tự.'); return false; }
        if (pw.length < 6) { message(loginError, 'Mật khẩu tối thiểu 6 ký tự.'); return false; }
        submitButton.disabled = true; submitButton.textContent = 'Đang kiểm tra…';
        post('/api/login', {username:user, password:pw}).then(function (r) {
          if (!r.success) throw new Error(r.message || 'Sai tài khoản hoặc mật khẩu.');
          if (!rememberMe.checked) localStorage.removeItem('bangbang.username');
          accept(r);
        }).catch(function (e) {
          message(loginError, e.message || 'Không thể kết nối máy chủ.', false);
        }).then(function () {
          submitButton.disabled = false; submitButton.textContent = 'Đăng nhập';
        });
        return false;
      };
      document.getElementById('logoutButton').onclick = function () {
        pending = null;
        post('/api/logout', {}).catch(function () {});
        document.getElementById('game').innerHTML = '';
        gameShell.style.display = 'none';
        entry.style.display = 'block';
        show(loginForm);
      };
      document.getElementById('enterGameButton').onclick = function () {
        var btn = this;
        if (!pending) { show(loginForm); return; }
        btn.disabled = true; btn.textContent = 'Đang vào game…';
        post('/api/session', {}).then(function (r) {
          if (!r.success || !r.loginToken) throw new Error('Phiên hết hạn.');
          pending = {username: r.username || pending.username, loginToken: String(r.loginToken)};
          mountGame();
        }).catch(function (e) {
          message(welcomeError, e.message || 'Không thể xác thực.', false);
        }).then(function () {
          btn.disabled = false; btn.textContent = 'Vào game';
        });
      };
      post('/api/session', {}).then(function (r) { if (r.success && r.loginToken) accept(r); }).catch(function () {});
    }());
  </script>
</body>
</html>
